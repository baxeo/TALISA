services:
  - type: web
    name: baxeo-africa
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: VITE_PUBLIC_SITE_ONLY
        value: "true"
    disk:
      name: baxeo-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1